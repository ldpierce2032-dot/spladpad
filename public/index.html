* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

    font-family: "Segoe UI", Arial, sans-serif;

    background:
        linear-gradient(
            135deg,
            #06172c,
            #0b2d52,
            #146aa3
        );

    color: white;
}


/* =========================
   TOP BAR
   ========================= */

#top-bar {
    position: absolute;
    top: 0;
    left: 0;

    width: 100%;
    height: 50px;

    background: #000;

    display: flex;
    align-items: center;

    padding: 0 15px;

    z-index: 2000;

    box-shadow:
        0 3px 10px rgba(0,0,0,.5);
}

.logo-text {
    display: flex;
    align-items: center;
    gap: 8px;
    color: white;
    font-size: 20px;
    font-weight: bold;
    letter-spacing: 1px;
}

.logo-icon {
    width: 32px;
    height: 32px;
    object-fit: contain;
    flex: 0 0 32px;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,.55));
}

.top-search {
    margin-left: 20px;

    width: 220px;

    padding: 7px 10px;

    border-radius: 4px;
    border: 1px solid #24547d;

    background: #102b47;
    color: white;

    outline: none;
}

.top-search::placeholder {
    color: #9bb7d4;
}


/* =========================
   MAIN LAYOUT
   ========================= */

#dashboard-layout {
    position: absolute;

    top: 50px;
    left: 0;

    width: 100%;
    height: calc(100% - 50px);

    display: flex;

    background:
        linear-gradient(
            135deg,
            #071a33,
            #0a2a4d,
            #145d91
        );
}


/* =========================
   SIDEBAR
   ========================= */

#sidebar {
    width: 190px;
    min-width: 190px;

    height: 100%;

    background: #06172c;

    border-right:
        1px solid #1e4c72;

    padding-top: 10px;

    box-shadow:
        3px 0 10px rgba(0,0,0,.3);
}

.side-item {
    padding: 13px 18px;

    color: #7898b4;

    font-size: 14px;
    font-weight: 600;

    cursor: pointer;

    border-left:
        4px solid transparent;

    transition: .15s;
}

.side-item:hover {
    background: #10395e;
    color: white;
}

.side-item.active {
    background: #123f66;

    color: white;

    border-left:
        4px solid #28b5ff;
}


/* =========================
   CONTENT
   ========================= */

#main-content {
    flex: 1;

    height: 100%;

    padding: 25px;

    overflow-y: auto;
}

.page {
    display: none;
}

.page.active {
    display: block;
}


/* =========================
   PANELS
   ========================= */

.dashboard-panel {
    max-width: 700px;

    margin-bottom: 18px;

    padding: 18px;

    border-radius: 7px;

    background:
        linear-gradient(
            145deg,
            #eaf7ff,
            #cceaff
        );

    border:
        1px solid #65aeda;

    color: #082943;

    box-shadow:
        0 5px 15px rgba(0,0,0,.25);
}

.panel-title {
    margin-bottom: 15px;

    padding-bottom: 8px;

    border-bottom:
        1px solid #8fc9e9;

    font-size: 17px;
    font-weight: bold;
}


/* =========================
   INPUTS
   ========================= */

.input-field,
textarea,
select {
    width: 100%;

    padding: 11px;

    margin-bottom: 12px;

    border:
        1px solid #76b5d8;

    border-radius: 4px;

    background: white;

    color: #082943;

    font-size: 14px;

    outline: none;
}

textarea {
    min-height: 100px;

    resize: vertical;
}


/* =========================
   BUTTONS
   ========================= */

.action-btn {
    width: 100%;

    padding: 12px 20px;

    border: none;
    border-radius: 5px;

    background:
        linear-gradient(
            135deg,
            #0879c9,
            #18a8ed
        );

    color: white;

    font-size: 14px;
    font-weight: bold;

    letter-spacing: 1px;

    cursor: pointer;

    box-shadow:
        0 3px 7px rgba(0,0,0,.25);

    transition: .15s;

    margin-top: 5px;
}

.action-btn:hover {
    filter: brightness(1.1);
}

.action-btn:active {
    transform: scale(.98);
}

.small-btn {
    padding: 8px 12px;

    background: #0879c9;

    color: white;

    border: none;

    border-radius: 4px;

    cursor: pointer;
}


/* =========================
   ACCOUNT TABS
   ========================= */

.account-tabs {
    display: flex;

    gap: 8px;

    margin-bottom: 15px;
}

.account-tab {
    flex: 1;

    padding: 10px;

    border: none;

    border-radius: 4px;

    background: #a9d7ef;

    color: #123d5f;

    font-weight: bold;

    cursor: pointer;
}

.account-tab.active {
    background: #0879c9;

    color: white;
}

.avatar-circle img {

.greeting-text {

    font-weight: bold;

/* =========================
   3D AVATAR + AIR SPARKLES
   ========================= */

.character-preview,
.avatar-circle,
.profile-avatar,
.player-avatar {
    position: relative;
    perspective: 700px;
    transform-style: preserve-3d;
}

.character-preview {
    box-shadow:
        inset 0 0 25px rgba(0,0,0,.28),
        0 10px 22px rgba(0,0,0,.28);
}

.character-preview img,
.avatar-circle img,
.profile-avatar img,
.player-avatar img {
    position: relative;
    z-index: 3;

    transform:
        translateZ(18px)
        rotateX(1deg);

    filter:
        drop-shadow(7px 10px 4px rgba(0,0,0,.34));

    transition:
        filter .2s,
        transform .25s;
}

.character-preview:hover img {
    transform:
        translateZ(28px)
        rotateX(2deg)
        rotateY(-2deg);
}

.character-preview::after,
.avatar-circle::after,
.profile-avatar::after,
.player-avatar::after {
    content: "";

    position: absolute;
    left: 15%;
    right: 15%;
    bottom: 7%;

    height: 13%;

    border-radius: 50%;

    background: rgba(0,0,0,.25);

    filter: blur(8px);

    transform:
        translateZ(0)
        rotateX(65deg);

    z-index: 1;
}

.air-sparkles {
    position: absolute;
    inset: 0;
    z-index: 8;
    pointer-events: none;
    overflow: hidden;
}

.air-sparkle {
    position: absolute;

    width: 18px;
    height: 18px;

    opacity: 0;

    transform:
        scale(.2)
        rotate(45deg);

    background: #fff;

    box-shadow:
        0 0 10px #fff,
        0 0 24px rgba(255,255,255,.95);

    clip-path:
        polygon(
            50% 0%,
            62% 38%,
            100% 50%,
            62% 62%,
            50% 100%,
            38% 62%,
            0% 50%,
            38% 38%
        );

    animation:
        airSparkle 2.8s ease-out forwards;
}

@keyframes airSparkle {
    0% {
        opacity: 0;
        transform:
            translate3d(0, 22px, 0)
            scale(.15)
            rotate(0deg);
    }

    12% {
        opacity: 1;
        transform:
            translate3d(0, 12px, 12px)
            scale(.9)
            rotate(25deg);
    }

    55% {
        opacity: .95;
        transform:
            translate3d(var(--dx), -35px, 25px)
            scale(1.45)
            rotate(90deg);
    }

    100% {
        opacity: 0;
        transform:
            translate3d(
                calc(var(--dx) * 1.35),
                -85px,
                35px
            )
            scale(.2)
            rotate(180deg);
    }
}
